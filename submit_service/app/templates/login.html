{% extends 'base.html' %}
{% block title %}Login | fedctl{% endblock %}
{% block content %}
<section class="panel narrow">
  <div class="eyebrow">Internal access</div>
  <h1>Login</h1>
  {% if error %}
  <div class="alert error">{{ error }}</div>
  {% endif %}
  <form method="post" action="/login" class="stack">
    <label for="token">Bearer token</label>
    <input id="token" name="token" type="password" required autofocus>
    <button type="submit">Log in</button>
  </form>
  {% if registration_enabled %}
  <p class="muted">Need a token? Run <code>fedctl submit register-token --name &lt;username&gt;</code> in your terminal.</p>
  {% endif %}
</section>
{% endblock %}
